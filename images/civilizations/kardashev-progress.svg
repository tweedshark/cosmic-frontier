<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <defs>
    <linearGradient id="scaleBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#030308"/>
      <stop offset="50%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#030308"/>
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scaleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#scaleBg)"/>
  <!-- Scale bar -->
  <g transform="translate(100, 150)">
    <!-- Background bar -->
    <rect x="0" y="-3" width="600" height="6" fill="#ffffff" fill-opacity="0.05" rx="3"/>
    <!-- Filled progress -->
    <rect x="0" y="-3" width="600" height="6" fill="url(#scaleGrad)" fill-opacity="0.4" rx="3"/>
    <!-- Scale markers -->
    <g font-family="monospace" font-size="8" text-anchor="middle">
      <!-- Type 0 -->
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#00f5ff" stroke-opacity="0.5"/>
      <circle cx="0" cy="0" r="6" fill="#00f5ff" opacity="0.3"/>
      <text x="0" y="-25" fill="#00f5ff" opacity="0.5">TYPE 0</text>
      <text x="0" y="35" fill="#606080" font-size="7">2024 CE</text>
      <!-- Type I -->
      <line x1="200" y1="-15" x2="200" y2="15" stroke="#00f5ff" stroke-opacity="0.8"/>
      <circle cx="200" cy="0" r="10" stroke="#00f5ff" stroke-width="2" fill="#00f5ff" fill-opacity="0.2" filter="url(#glow6)"/>
      <text x="200" y="-25" fill="#00f5ff" opacity="0.8">TYPE I</text>
      <text x="200" y="35" fill="#00f5ff" opacity="0.5" font-size="7">2150 CE</text>
      <!-- Planet icon -->
      <circle cx="200" cy="-50" r="12" fill="#1e3a5f" stroke="#00f5ff" stroke-width="1" filter="url(#glow6)"/>
      <circle cx="200" cy="-50" r="12" fill="none" stroke="#00f5ff" stroke-opacity="0.3" stroke-dasharray="2 2">
        <animateTransform attributeName="transform" type="rotate" from="0 200 -50" to="360 200 -50" dur="10s" repeatCount="indefinite"/>
      </circle>
      <!-- Type II -->
      <line x1="400" y1="-15" x2="400" y2="15" stroke="#ff00ff" stroke-opacity="0.8"/>
      <circle cx="400" cy="0" r="10" stroke="#ff00ff" stroke-width="2" fill="#ff00ff" fill-opacity="0.2" filter="url(#glow6)"/>
      <text x="400" y="-25" fill="#ff00ff" opacity="0.8">TYPE II</text>
      <text x="400" y="35" fill="#ff00ff" opacity="0.5" font-size="7">2500 CE</text>
      <!-- Dyson sphere icon -->
      <circle cx="400" cy="-50" r="6" fill="#ffd700" filter="url(#glow6)"/>
      <circle cx="400" cy="-50" r="14" stroke="#ff00ff" stroke-width="1" fill="none">
        <animateTransform attributeName="transform" type="rotate" from="0 400 -50" to="360 400 -50" dur="8s" repeatCount="indefinite"/>
      </circle>
      <ellipse cx="400" cy="-50" rx="14" ry="6" stroke="#ff00ff" stroke-width="0.5" fill="none" transform="rotate(60, 400, -50)"/>
      <!-- Type III -->
      <line x1="600" y1="-15" x2="600" y2="15" stroke="#ff6a00" stroke-opacity="0.8"/>
      <circle cx="600" cy="0" r="10" stroke="#ff6a00" stroke-width="2" fill="#ff6a00" fill-opacity="0.2" filter="url(#glow6)"/>
      <text x="600" y="-25" fill="#ff6a00" opacity="0.8">TYPE III</text>
      <text x="600" y="35" fill="#ff6a00" opacity="0.5" font-size="7">10000+ CE</text>
      <!-- Galaxy icon -->
      <g transform="translate(600, -50)" filter="url(#glow6)">
        <circle cx="0" cy="0" r="4" fill="#ff6a00" opacity="0.8"/>
        <ellipse cx="0" cy="0" rx="15" ry="5" stroke="#ff6a00" stroke-width="0.8" fill="none" opacity="0.5">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="0" cy="0" rx="12" ry="8" stroke="#ff6a00" stroke-width="0.5" fill="none" opacity="0.3" transform="rotate(45)">
          <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="15s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>
    <!-- Energy output labels -->
    <g font-family="monospace" font-size="6" fill="#606080" text-anchor="middle">
      <text x="0" y="50">10^16 W</text>
      <text x="200" y="50">10^17 W</text>
      <text x="400" y="50">10^26 W</text>
      <text x="600" y="50">10^36 W</text>
    </g>
  </g>
  <!-- Title -->
  <text x="400" y="270" font-family="monospace" font-size="9" fill="#606080" text-anchor="middle" letter-spacing="4">KARDASHEV SCALE PROGRESSION</text>
</svg>