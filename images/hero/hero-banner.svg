<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" fill="none">
  <defs>
    <radialGradient id="heroBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0d0d2b"/>
      <stop offset="40%" stop-color="#070718"/>
      <stop offset="100%" stop-color="#020206"/>
    </radialGradient>
    <radialGradient id="nebula1" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#1a0a3e" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0d0520" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="70%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#003040" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#001520" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f5ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="hGlow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hGlow2">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hGlow3">
      <feGaussianBlur stdDeviation="15" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="warpLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#00f5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Deep space background -->
  <rect width="1200" height="500" fill="url(#heroBg)"/>

  <!-- Nebula clouds -->
  <rect width="1200" height="500" fill="url(#nebula1)"/>
  <rect width="1200" height="500" fill="url(#nebula2)"/>

  <!-- Distant galaxy cluster -->
  <g opacity="0.15">
    <ellipse cx="900" cy="150" rx="80" ry="25" fill="#ff00ff" filter="url(#hGlow3)">
      <animateTransform attributeName="transform" type="rotate" from="0 900 150" to="360 900 150" dur="60s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="900" cy="150" rx="60" ry="40" fill="#9900ff" filter="url(#hGlow3)">
      <animateTransform attributeName="transform" type="rotate" from="30 900 150" to="390 900 150" dur="45s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="900" cy="150" r="8" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Star field - hundreds of stars at various sizes -->
  <g fill="#ffffff">
    <!-- Tiny distant stars -->
    <circle cx="15" cy="30" r="0.3" opacity="0.4"/><circle cx="45" cy="80" r="0.4" opacity="0.3"/>
    <circle cx="78" cy="15" r="0.3" opacity="0.5"/><circle cx="110" cy="120" r="0.5" opacity="0.4"/>
    <circle cx="155" cy="45" r="0.3" opacity="0.3"/><circle cx="190" cy="170" r="0.4" opacity="0.5"/>
    <circle cx="230" cy="30" r="0.3" opacity="0.4"/><circle cx="270" cy="90" r="0.5" opacity="0.3"/>
    <circle cx="310" cy="150" r="0.3" opacity="0.5"/><circle cx="350" cy="20" r="0.4" opacity="0.4"/>
    <circle cx="390" cy="110" r="0.3" opacity="0.3"/><circle cx="430" cy="60" r="0.5" opacity="0.5"/>
    <circle cx="470" cy="180" r="0.3" opacity="0.4"/><circle cx="510" cy="40" r="0.4" opacity="0.3"/>
    <circle cx="550" cy="130" r="0.3" opacity="0.5"/><circle cx="590" cy="70" r="0.5" opacity="0.4"/>
    <circle cx="630" cy="160" r="0.3" opacity="0.3"/><circle cx="670" cy="25" r="0.4" opacity="0.5"/>
    <circle cx="710" cy="100" r="0.3" opacity="0.4"/><circle cx="750" cy="170" r="0.5" opacity="0.3"/>
    <circle cx="790" cy="50" r="0.3" opacity="0.5"/><circle cx="830" cy="140" r="0.4" opacity="0.4"/>
    <circle cx="870" cy="35" r="0.3" opacity="0.3"/><circle cx="920" cy="85" r="0.5" opacity="0.5"/>
    <circle cx="960" cy="170" r="0.3" opacity="0.4"/><circle cx="1000" cy="45" r="0.4" opacity="0.3"/>
    <circle cx="1040" cy="125" r="0.3" opacity="0.5"/><circle cx="1080" cy="60" r="0.5" opacity="0.4"/>
    <circle cx="1120" cy="155" r="0.3" opacity="0.3"/><circle cx="1160" cy="30" r="0.4" opacity="0.5"/>
    <circle cx="60" cy="250" r="0.3" opacity="0.4"/><circle cx="130" cy="300" r="0.4" opacity="0.3"/>
    <circle cx="200" cy="380" r="0.3" opacity="0.5"/><circle cx="280" cy="450" r="0.5" opacity="0.4"/>
    <circle cx="340" cy="280" r="0.3" opacity="0.3"/><circle cx="420" cy="350" r="0.4" opacity="0.5"/>
    <circle cx="500" cy="420" r="0.3" opacity="0.4"/><circle cx="580" cy="300" r="0.5" opacity="0.3"/>
    <circle cx="660" cy="380" r="0.3" opacity="0.5"/><circle cx="740" cy="440" r="0.4" opacity="0.4"/>
    <circle cx="820" cy="320" r="0.3" opacity="0.3"/><circle cx="900" cy="400" r="0.5" opacity="0.5"/>
    <circle cx="980" cy="280" r="0.3" opacity="0.4"/><circle cx="1060" cy="360" r="0.4" opacity="0.3"/>
    <circle cx="1140" cy="420" r="0.3" opacity="0.5"/><circle cx="1180" cy="280" r="0.5" opacity="0.4"/>
    <!-- Medium stars -->
    <circle cx="100" cy="200" r="0.8" opacity="0.6"/><circle cx="320" cy="350" r="0.7" opacity="0.5"/>
    <circle cx="540" cy="250" r="0.9" opacity="0.6"/><circle cx="760" cy="280" r="0.7" opacity="0.5"/>
    <circle cx="980" cy="350" r="0.8" opacity="0.6"/><circle cx="180" cy="400" r="0.7" opacity="0.5"/>
    <circle cx="440" cy="430" r="0.9" opacity="0.6"/><circle cx="680" cy="460" r="0.7" opacity="0.5"/>
    <circle cx="1100" cy="200" r="0.8" opacity="0.6"/>
  </g>

  <!-- Twinkling bright stars -->
  <g filter="url(#hGlow)">
    <circle cx="250" cy="100" r="1.5" fill="#ffffff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="80" r="1.2" fill="#00f5ff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="120" r="1.8" fill="#ffffff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="400" r="1.3" fill="#ffd700" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Central wormhole / portal -->
  <g transform="translate(600, 250)" filter="url(#hGlow2)">
    <!-- Outer energy rings -->
    <ellipse cx="0" cy="0" rx="180" ry="60" stroke="#00f5ff" stroke-width="0.5" fill="none" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="160" ry="80" stroke="#ff00ff" stroke-width="0.3" fill="none" opacity="0.1">
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="25s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="140" ry="100" stroke="#00f5ff" stroke-width="0.3" fill="none" opacity="0.08">
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="35s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Warp tunnel rings -->
    <ellipse cx="0" cy="0" rx="80" ry="30" stroke="#00f5ff" stroke-width="1" fill="none" opacity="0.3">
      <animate attributeName="rx" values="80;85;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="30;33;30" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="60" ry="22" stroke="#00f5ff" stroke-width="1.5" fill="none" opacity="0.4">
      <animate attributeName="rx" values="60;64;60" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="40" ry="15" stroke="#00f5ff" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="rx" values="40;43;40" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="20" ry="8" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="rx" values="20;22;20" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Central bright point -->
    <circle cx="0" cy="0" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="0" r="12" fill="#00f5ff" opacity="0.15"/>
  </g>

  <!-- Warp speed lines converging on center -->
  <g opacity="0.3">
    <line x1="0" y1="250" x2="420" y2="250" stroke="url(#warpLine)" stroke-width="0.5">
      <animate attributeName="x2" values="420;440;420" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="200" x2="430" y2="235" stroke="url(#warpLine)" stroke-width="0.3"/>
    <line x1="0" y1="300" x2="430" y2="265" stroke="url(#warpLine)" stroke-width="0.3"/>
    <line x1="1200" y1="250" x2="780" y2="250" stroke="url(#warpLine)" stroke-width="0.5">
      <animate attributeName="x2" values="780;760;780" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="1200" y1="200" x2="770" y2="235" stroke="url(#warpLine)" stroke-width="0.3"/>
    <line x1="1200" y1="300" x2="770" y2="265" stroke="url(#warpLine)" stroke-width="0.3"/>
    <line x1="600" y1="0" x2="600" y2="180" stroke="url(#warpLine)" stroke-width="0.3"/>
    <line x1="600" y1="500" x2="600" y2="320" stroke="url(#warpLine)" stroke-width="0.3"/>
    <line x1="200" y1="0" x2="520" y2="220" stroke="url(#warpLine)" stroke-width="0.2"/>
    <line x1="1000" y1="0" x2="680" y2="220" stroke="url(#warpLine)" stroke-width="0.2"/>
    <line x1="200" y1="500" x2="520" y2="280" stroke="url(#warpLine)" stroke-width="0.2"/>
    <line x1="1000" y1="500" x2="680" y2="280" stroke="url(#warpLine)" stroke-width="0.2"/>
  </g>

  <!-- Floating debris / asteroids near edges -->
  <g opacity="0.3" fill="#404060">
    <polygon points="50,350 58,345 62,355 55,360" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0;5,-3;0,0" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="1130,380 1140,372 1148,380 1138,388" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0,0;-4,2;0,0" dur="10s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="80,120 92,115 96,128 85,132" opacity="0.3"/>
    <polygon points="1100,100 1108,92 1115,102 1105,108" opacity="0.35"/>
  </g>

  <!-- Planet in distance (bottom right) -->
  <g transform="translate(1050, 420)">
    <circle cx="0" cy="0" r="60" fill="#0a0a2a" opacity="0.8"/>
    <circle cx="0" cy="0" r="60" stroke="#1a0a3e" stroke-width="1" fill="none" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="80" ry="8" stroke="#00f5ff" stroke-width="0.5" fill="none" opacity="0.2" transform="rotate(-15)"/>
    <path d="M-40,-45 Q-20,-50 0,-45 Q20,-40 40,-45" stroke="#1a1a4a" stroke-width="0.5" fill="none" opacity="0.3"/>
    <!-- Atmosphere glow -->
    <circle cx="0" cy="0" r="62" stroke="#00f5ff" stroke-width="1" fill="none" opacity="0.1" filter="url(#hGlow)"/>
  </g>

  <!-- Ship silhouettes heading toward wormhole -->
  <g filter="url(#hGlow)">
    <!-- Small fighter/scout -->
    <polygon points="-6,-3 6,0 -6,3 -4,0" fill="#00f5ff" opacity="0.6" transform="translate(380, 230)">
      <animateTransform attributeName="transform" type="translate" values="380,230;400,235;380,230" dur="6s" repeatCount="indefinite"/>
    </polygon>
    <!-- Larger vessel -->
    <polygon points="-10,-4 10,0 -10,4 -7,0" fill="#00f5ff" opacity="0.4" transform="translate(350, 260)">
      <animateTransform attributeName="transform" type="translate" values="350,260;370,258;350,260" dur="8s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Coordinate grid overlay (very subtle) -->
  <g stroke="#00f5ff" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/><line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>
  </g>
</svg>