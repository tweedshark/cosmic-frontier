<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a2a"/>
      <stop offset="100%" stop-color="#030308"/>
    </radialGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg5)"/>
  <!-- Background stars -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="30" cy="50" r="0.5"/><circle cx="90" cy="120" r="0.6"/><circle cx="170" cy="30" r="0.4"/>
    <circle cx="230" cy="180" r="0.5"/><circle cx="310" cy="70" r="0.3"/><circle cx="380" cy="150" r="0.6"/>
    <circle cx="450" cy="50" r="0.4"/><circle cx="530" cy="130" r="0.5"/><circle cx="600" cy="60" r="0.3"/>
    <circle cx="670" cy="170" r="0.6"/><circle cx="740" cy="40" r="0.4"/><circle cx="770" cy="180" r="0.5"/>
    <circle cx="60" cy="280" r="0.4"/><circle cx="140" cy="350" r="0.5"/><circle cx="420" cy="320" r="0.3"/>
    <circle cx="560" cy="350" r="0.6"/><circle cx="680" cy="300" r="0.4"/><circle cx="750" cy="360" r="0.5"/>
  </g>
  <!-- Trade routes -->
  <g stroke-width="1.5" fill="none" filter="url(#glow5)">
    <!-- Sol to Alpha Centauri -->
    <path d="M200,200 Q250,170 320,180" stroke="#00f5ff" stroke-opacity="0.3" stroke-dasharray="4 3"/>
    <!-- Sol to Kepler-442b -->
    <path d="M200,200 Q350,250 500,220" stroke="#00ff88" stroke-opacity="0.25" stroke-dasharray="4 3"/>
    <!-- Alpha Centauri to Trappist -->
    <path d="M320,180 Q400,150 450,140" stroke="#00f5ff" stroke-opacity="0.2" stroke-dasharray="4 3"/>
    <!-- Kepler to Andromeda Relay -->
    <path d="M500,220 Q580,250 650,260" stroke="#ff00ff" stroke-opacity="0.2" stroke-dasharray="4 3"/>
    <!-- Sol to Sirius -->
    <path d="M200,200 Q180,260 150,300" stroke="#ffd700" stroke-opacity="0.2" stroke-dasharray="4 3"/>
    <!-- Trappist to Kepler -->
    <path d="M450,140 Q480,180 500,220" stroke="#ff6a00" stroke-opacity="0.2" stroke-dasharray="4 3"/>
  </g>
  <!-- Hazard zones -->
  <ellipse cx="380" cy="280" rx="40" ry="25" stroke="#ff0000" stroke-opacity="0.15" fill="#ff0000" fill-opacity="0.03" stroke-dasharray="2 4">
    <animate attributeName="rx" values="40;45;40" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <text x="380" y="300" font-family="monospace" font-size="6" fill="#ff0000" text-anchor="middle" opacity="0.4">VOID STORM ZONE</text>
  <ellipse cx="580" cy="150" rx="30" ry="20" stroke="#ff6a00" stroke-opacity="0.15" fill="#ff6a00" fill-opacity="0.03" stroke-dasharray="2 4"/>
  <text x="580" y="165" font-family="monospace" font-size="6" fill="#ff6a00" text-anchor="middle" opacity="0.4">CHRONO RIFT</text>
  <!-- Star systems -->
  <g filter="url(#glow5)">
    <!-- Sol -->
    <circle cx="200" cy="200" r="8" fill="#ffd700" opacity="0.8"/>
    <circle cx="200" cy="200" r="15" stroke="#ffd700" stroke-opacity="0.2" fill="none"/>
    <text x="200" y="230" font-family="monospace" font-size="9" fill="#ffd700" text-anchor="middle" opacity="0.7">SOL</text>
    <!-- Alpha Centauri -->
    <circle cx="320" cy="180" r="6" fill="#00f5ff" opacity="0.7"/>
    <circle cx="320" cy="180" r="12" stroke="#00f5ff" stroke-opacity="0.2" fill="none"/>
    <text x="320" y="170" font-family="monospace" font-size="7" fill="#00f5ff" text-anchor="middle" opacity="0.6">ALPHA CENTAURI</text>
    <!-- Trappist-1 -->
    <circle cx="450" cy="140" r="5" fill="#ff6a00" opacity="0.7"/>
    <text x="450" y="130" font-family="monospace" font-size="7" fill="#ff6a00" text-anchor="middle" opacity="0.6">TRAPPIST-1</text>
    <!-- Kepler-442 -->
    <circle cx="500" cy="220" r="7" fill="#00ff88" opacity="0.7"/>
    <circle cx="500" cy="220" r="14" stroke="#00ff88" stroke-opacity="0.2" fill="none"/>
    <text x="500" y="245" font-family="monospace" font-size="7" fill="#00ff88" text-anchor="middle" opacity="0.6">KEPLER-442</text>
    <!-- Andromeda Relay -->
    <circle cx="650" cy="260" r="5" fill="#ff00ff" opacity="0.6"/>
    <text x="650" y="280" font-family="monospace" font-size="7" fill="#ff00ff" text-anchor="middle" opacity="0.5">ANDROMEDA RELAY</text>
    <!-- Sirius -->
    <circle cx="150" cy="300" r="6" fill="#ffffff" opacity="0.7"/>
    <text x="150" y="320" font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.5">SIRIUS</text>
  </g>
  <!-- Ship icons on routes -->
  <polygon points="-4,-2 4,0 -4,2" fill="#00f5ff" opacity="0.7">
    <animateMotion dur="8s" repeatCount="indefinite" path="M200,200 Q250,170 320,180"/>
  </polygon>
  <polygon points="-4,-2 4,0 -4,2" fill="#00ff88" opacity="0.7">
    <animateMotion dur="10s" repeatCount="indefinite" path="M200,200 Q350,250 500,220"/>
  </polygon>
  <!-- Distance scale -->
  <g transform="translate(30, 370)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#00f5ff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#00f5ff" stroke-opacity="0.3"/>
    <line x1="100" y1="-3" x2="100" y2="3" stroke="#00f5ff" stroke-opacity="0.3"/>
    <text x="50" y="15" font-family="monospace" font-size="7" fill="#00f5ff" text-anchor="middle" opacity="0.4">100 LIGHT YEARS</text>
  </g>
</svg>