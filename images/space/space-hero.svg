<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <radialGradient id="sbg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a2a"/>
      <stop offset="100%" stop-color="#030308"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="40%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>
    <filter id="sGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sGlow2">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sGlow3">
      <feGaussianBlur stdDeviation="15" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="engineTrail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00f5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sbg)"/>

  <!-- Background stars -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="20" cy="30" r="0.4"/><circle cx="80" cy="90" r="0.5"/><circle cx="150" cy="20" r="0.3"/>
    <circle cx="230" cy="70" r="0.6"/><circle cx="310" cy="35" r="0.4"/><circle cx="420" cy="80" r="0.5"/>
    <circle cx="510" cy="30" r="0.3"/><circle cx="590" cy="60" r="0.6"/><circle cx="680" cy="40" r="0.4"/>
    <circle cx="750" cy="90" r="0.5"/><circle cx="40" cy="180" r="0.3"/><circle cx="120" cy="300" r="0.4"/>
    <circle cx="680" cy="280" r="0.5"/><circle cx="760" cy="350" r="0.3"/>
    <circle cx="350" cy="450" r="0.4"/><circle cx="50" cy="430" r="0.5"/><circle cx="500" cy="470" r="0.3"/>
    <circle cx="720" cy="420" r="0.4"/><circle cx="250" cy="140" r="0.5"/>
    <!-- Medium stars -->
    <circle cx="160" cy="160" r="0.8" opacity="0.5"/><circle cx="600" cy="400" r="0.7" opacity="0.4"/>
    <circle cx="400" cy="120" r="0.9" opacity="0.5"/>
  </g>

  <!-- Twinkling stars -->
  <g filter="url(#sGlow)">
    <circle cx="300" cy="50" r="1.2" fill="#ffffff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="150" r="1.5" fill="#ffffff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="350" r="1" fill="#ffd700" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Planet (Earth-like) in lower left -->
  <g transform="translate(120, 400)">
    <circle cx="0" cy="0" r="100" fill="#061828"/>
    <!-- Continents hint -->
    <path d="M-50,-60 Q-30,-70 -10,-55 Q10,-60 30,-50 Q40,-40 35,-25" stroke="#00f5ff" stroke-width="0.5" fill="#00f5ff" fill-opacity="0.04" stroke-opacity="0.2"/>
    <path d="M-60,-20 Q-40,-30 -20,-15 Q0,-25 20,-10" stroke="#00f5ff" stroke-width="0.5" fill="none" stroke-opacity="0.15"/>
    <path d="M-30,30 Q-10,20 10,35 Q30,25 50,40" stroke="#00ff88" stroke-width="0.5" fill="#00ff88" fill-opacity="0.03" stroke-opacity="0.15"/>
    <!-- Atmosphere -->
    <circle cx="0" cy="0" r="103" stroke="#00f5ff" stroke-width="1.5" fill="none" opacity="0.1" filter="url(#sGlow)"/>
    <circle cx="0" cy="0" r="108" stroke="#00f5ff" stroke-width="1" fill="none" opacity="0.05" filter="url(#sGlow2)"/>
    <!-- City lights on dark side -->
    <g fill="#ffd700" opacity="0.3">
      <circle cx="-40" cy="-40" r="1"/><circle cx="-25" cy="-45" r="0.8"/>
      <circle cx="10" cy="-35" r="1.2"/><circle cx="-15" cy="-20" r="0.7"/>
      <circle cx="25" cy="-25" r="0.9"/>
    </g>
    <!-- Orbital ring/station -->
    <ellipse cx="0" cy="0" rx="130" ry="20" stroke="#00f5ff" stroke-width="0.5" fill="none" opacity="0.15" transform="rotate(-25)"/>
  </g>

  <!-- Colony Ship - main vessel -->
  <g transform="translate(450, 250)">
    <!-- Engine glow -->
    <ellipse cx="-120" cy="0" rx="30" ry="15" fill="#00f5ff" opacity="0.1" filter="url(#sGlow3)">
      <animate attributeName="rx" values="30;35;30" dur="2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Engine trails -->
    <g opacity="0.4">
      <line x1="-100" y1="-8" x2="-220" y2="-12" stroke="url(#engineTrail)" stroke-width="3"/>
      <line x1="-100" y1="0" x2="-250" y2="0" stroke="url(#engineTrail)" stroke-width="4"/>
      <line x1="-100" y1="8" x2="-220" y2="12" stroke="url(#engineTrail)" stroke-width="3"/>
    </g>

    <!-- Ship hull -->
    <g filter="url(#sGlow)">
      <!-- Main body -->
      <path d="M80,0 L60,-15 L-80,-20 L-100,-12 L-100,12 L-80,20 L60,15 Z" fill="#1a1a3a" stroke="#2a2a5a" stroke-width="1"/>
      <!-- Bridge/command section -->
      <path d="M80,0 L95,-5 L95,5 Z" fill="#0a0a2a" stroke="#00f5ff" stroke-width="0.5" stroke-opacity="0.4"/>
      <!-- Window ports -->
      <g fill="#00f5ff" opacity="0.5">
        <circle cx="70" cy="-3" r="1.5"/><circle cx="70" cy="3" r="1.5"/>
        <circle cx="60" cy="-8" r="1"/><circle cx="50" cy="-10" r="1"/><circle cx="40" cy="-11" r="1"/>
        <circle cx="60" cy="8" r="1"/><circle cx="50" cy="10" r="1"/><circle cx="40" cy="11" r="1"/>
      </g>
      <!-- Cargo/habitat ring -->
      <ellipse cx="-20" cy="0" rx="10" ry="25" stroke="#2a2a5a" stroke-width="1" fill="none"/>
      <ellipse cx="-20" cy="0" rx="10" ry="22" stroke="#00f5ff" stroke-width="0.5" stroke-opacity="0.2" fill="none"/>
      <!-- Engine nacelles -->
      <rect x="-100" y="-18" width="20" height="8" fill="#1a1a3a" stroke="#2a2a5a" stroke-width="0.5" rx="2"/>
      <rect x="-100" y="10" width="20" height="8" fill="#1a1a3a" stroke="#2a2a5a" stroke-width="0.5" rx="2"/>
      <!-- Engine glow -->
      <circle cx="-100" cy="-14" r="3" fill="#00f5ff" opacity="0.6">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-100" cy="14" r="3" fill="#00f5ff" opacity="0.6">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <!-- Ship name -->
      <text x="20" y="3" font-family="monospace" font-size="4" fill="#00f5ff" opacity="0.4">EXODUS-VII</text>
    </g>

    <!-- Shield envelope -->
    <ellipse cx="0" cy="0" rx="120" ry="40" stroke="#00f5ff" stroke-width="0.3" fill="none" opacity="0.1" stroke-dasharray="4 4">
      <animate attributeName="rx" values="120;125;120" dur="5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Escort ships -->
  <g filter="url(#sGlow)">
    <!-- Escort 1 -->
    <g transform="translate(380, 180)">
      <polygon points="20,0 15,-5 -15,-6 -20,-3 -20,3 -15,6 15,5" fill="#1a1a3a" stroke="#2a2a5a" stroke-width="0.5"/>
      <circle cx="-20" cy="0" r="1.5" fill="#00f5ff" opacity="0.5"/>
      <line x1="-22" y1="0" x2="-40" y2="0" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.3"/>
    </g>
    <!-- Escort 2 -->
    <g transform="translate(390, 320)">
      <polygon points="18,0 13,-4 -13,-5 -18,-3 -18,3 -13,5 13,4" fill="#1a1a3a" stroke="#2a2a5a" stroke-width="0.5"/>
      <circle cx="-18" cy="0" r="1.5" fill="#00f5ff" opacity="0.5"/>
      <line x1="-20" y1="0" x2="-35" y2="0" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.3"/>
    </g>
    <!-- Escort 3 -->
    <g transform="translate(350, 210)">
      <polygon points="15,0 11,-4 -11,-4 -15,-2 -15,2 -11,4 11,4" fill="#1a1a3a" stroke="#2a2a5a" stroke-width="0.5"/>
      <circle cx="-15" cy="0" r="1" fill="#00f5ff" opacity="0.4"/>
      <line x1="-16" y1="0" x2="-28" y2="0" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.2"/>
    </g>
  </g>

  <!-- Sun/star in far distance (right side) -->
  <g transform="translate(750, 200)">
    <circle cx="0" cy="0" r="15" fill="url(#sunGrad)" filter="url(#sGlow2)"/>
    <circle cx="0" cy="0" r="20" stroke="#ffd700" stroke-width="0.5" fill="none" opacity="0.1"/>
    <!-- Lens flare -->
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#ffd700" stroke-width="0.5" opacity="0.15"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#ffd700" stroke-width="0.3" opacity="0.1"/>
  </g>

  <!-- Distant nebula -->
  <g opacity="0.06">
    <ellipse cx="600" cy="100" rx="100" ry="40" fill="#ff00ff" filter="url(#sGlow3)"/>
    <ellipse cx="620" cy="90" rx="60" ry="30" fill="#7700ff" filter="url(#sGlow3)"/>
  </g>

  <!-- Navigation waypoints -->
  <g stroke="#00f5ff" stroke-opacity="0.15" fill="none" stroke-dasharray="3 5">
    <path d="M220,350 Q350,300 450,250 Q550,200 700,180"/>
    <!-- Waypoint markers -->
    <circle cx="350" cy="300" r="3" stroke-dasharray="none" stroke-opacity="0.2"/>
    <circle cx="550" cy="220" r="3" stroke-dasharray="none" stroke-opacity="0.2"/>
  </g>

  <!-- HUD overlay -->
  <g font-family="monospace" font-size="7" fill="#00f5ff" opacity="0.2">
    <text x="20" y="25">COLONY SHIP EXODUS-VII</text>
    <text x="20" y="37">DESTINATION: KEPLER-442b</text>
    <text x="20" y="49">CREW: 12,847 | STATUS: EN ROUTE</text>
    <text x="580" y="470">ETA: 127 YEARS</text>
    <text x="580" y="482">VELOCITY: 0.12c</text>
  </g>

  <!-- Corner brackets -->
  <g stroke="#00f5ff" stroke-opacity="0.12" fill="none" stroke-width="1">
    <path d="M15,15 L15,45 M15,15 L45,15"/>
    <path d="M785,15 L785,45 M785,15 L755,15"/>
    <path d="M15,485 L15,455 M15,485 L45,485"/>
    <path d="M785,485 L785,455 M785,485 L755,485"/>
  </g>
</svg>